<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1020" viewBox="0 0 900 1020" role="img" aria-labelledby="title desc">
<title id="title">Stage 1: prepare inputs and compare</title>
<desc id="desc">The same predictor values and spline settings enter independent R and Julia branches. Each constructs a centered basis B and penalty S. The first checkpoint compares B and S before fixed/random preparation. Each branch then prepares its own fixed and random model matrices. The second checkpoint compares the complete model representations. Dimensions show the main 200-observation, eight-function example. Comparison checkpoints do not supply shared matrices to either branch.</desc>
<rect width="900" height="1020" fill="white"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65798A"/></marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#243746">
<text x="450" y="38" font-size="24" font-weight="700" text-anchor="middle">Stage 1: prepare inputs and compare</text>

<rect x="18" y="210" width="864" height="302" rx="14" fill="#FAFCFD" stroke="#E2E8ED"/>
<rect x="18" y="546" width="864" height="310" rx="14" fill="#FAFCFD" stroke="#E2E8ED"/>
<text x="450" y="240" font-size="22" font-weight="700" text-anchor="middle">Build the basis and penalty</text>
<text x="450" y="579" font-size="22" font-weight="700" text-anchor="middle">Prepare the mixed-model inputs</text>

<g fill="none" stroke="#65798A" stroke-width="1.8">
<path d="M 450 162 V 184 H 235 V 262" marker-end="url(#arrow)"/>
<path d="M 450 184 H 665 V 262" marker-end="url(#arrow)"/>
<path d="M 235 368 V 606" marker-end="url(#arrow)"/>
<path d="M 665 368 V 606" marker-end="url(#arrow)"/>
<path d="M 235 447 H 294" marker-end="url(#arrow)"/>
<path d="M 665 447 H 606" marker-end="url(#arrow)"/>
<path d="M 235 688 V 720" marker-end="url(#arrow)"/>
<path d="M 665 688 V 720" marker-end="url(#arrow)"/>
<path d="M 235 836 V 882 H 665 V 836"/>
<path d="M 450 882 V 904" marker-end="url(#arrow)"/>
</g>
<circle cx="235" cy="447" r="3" fill="#65798A"/>
<circle cx="665" cy="447" r="3" fill="#65798A"/>

<rect x="170" y="66" width="560" height="96" rx="10" fill="#EEF4F9" stroke="#C8D3DC" stroke-width="1.4"/>
<text x="450" y="94" font-size="20" text-anchor="middle">Same predictor values and spline settings</text>
<text x="450" y="122" font-size="20" text-anchor="middle">200 observations · 8 raw basis functions</text>
<text x="450" y="148" font-size="18" text-anchor="middle">12 full knots · curvature penalty</text>

<rect x="60" y="268" width="350" height="100" rx="10" fill="#FFFFFF" stroke="#C8D3DC" stroke-width="1.4"/>
<text x="235" y="298" font-size="20" text-anchor="middle">R: mgcv construction</text>
<text x="235" y="329" font-family="Times New Roman, serif" font-size="22" text-anchor="middle"><tspan font-style="italic">B</tspan><tspan>: 200 × 7</tspan><tspan dx="24" font-style="italic">S</tspan><tspan>: 7 × 7</tspan></text>
<text x="235" y="354" font-size="18" text-anchor="middle">Centered basis and penalty</text>
<rect x="490" y="268" width="350" height="100" rx="10" fill="#FFFFFF" stroke="#C8D3DC" stroke-width="1.4"/>
<text x="665" y="298" font-size="20" text-anchor="middle">Julia construction</text>
<text x="665" y="329" font-family="Times New Roman, serif" font-size="22" text-anchor="middle"><tspan font-style="italic">B</tspan><tspan>: 200 × 7</tspan><tspan dx="24" font-style="italic">S</tspan><tspan>: 7 × 7</tspan></text>
<text x="665" y="354" font-size="18" text-anchor="middle">Centered basis and penalty</text>

<rect x="300" y="408" width="300" height="78" rx="10" fill="#EEF7F3" stroke="#C8D3DC" stroke-width="1.4"/>
<text x="450" y="437" font-size="21" font-weight="700" text-anchor="middle">1. Basis construction only</text>
<text x="450" y="465" font-size="20" text-anchor="middle">Compare B and S</text>

<rect x="60" y="612" width="350" height="76" rx="10" fill="#FFFFFF" stroke="#C8D3DC" stroke-width="1.4"/>
<text x="235" y="642" font-size="20" text-anchor="middle">R preparation</text>
<text x="235" y="670" font-size="18" text-anchor="middle">Fixed and random components</text>
<rect x="490" y="612" width="350" height="76" rx="10" fill="#FFFFFF" stroke="#C8D3DC" stroke-width="1.4"/>
