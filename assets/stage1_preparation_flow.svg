<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">Stage 1: prepare and compare</title>
<desc id="desc">Shared predictor values and spline settings enter independent R and Julia branches. The first comparison checks the constructed basis B and penalty S. Each branch then prepares its own fixed and random model inputs, X fixed and Z. The second comparison checks the complete model representations. The branches remain separate throughout preparation.</desc>
<rect width="900" height="660" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65798A"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#243746">
<text x="450" y="38" font-size="24" font-weight="700" text-anchor="middle">Stage 1: prepare and compare</text>
<g fill="none" stroke="#65798A" stroke-width="1.8">
<path d="M 450 132 V 154 H 235 V 204" marker-end="url(#arrow)"/>
<path d="M 450 154 H 665 V 204" marker-end="url(#arrow)"/>
<path d="M 235 280 V 412" marker-end="url(#arrow)"/>
<path d="M 665 280 V 412" marker-end="url(#arrow)"/>
<path d="M 235 343 H 294" marker-end="url(#arrow)"/>
<path d="M 665 343 H 606" marker-end="url(#arrow)"/>
<path d="M 235 496 V 526 H 665 V 496"/>
<path d="M 450 526 V 550" marker-end="url(#arrow)"/>
</g>
<circle cx="235" cy="343" r="3" fill="#65798A"/>
<circle cx="665" cy="343" r="3" fill="#65798A"/>
<rect x="220" y="66" width="460" height="66" rx="10" fill="#EEF4F9" stroke="#C8D3DC" stroke-width="1.4"/>
