<text x="235" y="817" font-family="Times New Roman, serif" font-size="22" text-anchor="middle"><tspan font-style="italic">Z</tspan><tspan>: 200 × 6</tspan></text>
<rect x="490" y="726" width="350" height="110" rx="10" fill="#FFFFFF" stroke="#C8D3DC" stroke-width="1.4"/>
<text x="665" y="756" font-size="20" text-anchor="middle">Julia model inputs</text>
<text x="665" y="787" font-family="Times New Roman, serif" font-size="22" text-anchor="middle"><tspan font-style="italic">X</tspan><tspan baseline-shift="sub" font-size="14">fixed</tspan><tspan baseline-shift="baseline" font-size="22">: 200 × 2</tspan></text>
<text x="665" y="817" font-family="Times New Roman, serif" font-size="22" text-anchor="middle"><tspan font-style="italic">Z</tspan><tspan>: 200 × 6</tspan></text>

<rect x="210" y="910" width="480" height="88" rx="10" fill="#EEF7F3" stroke="#C8D3DC" stroke-width="1.4"/>
<text x="450" y="941" font-size="21" font-weight="700" text-anchor="middle">2. Combined workflow</text>
<text x="450" y="976" font-size="20" text-anchor="middle">Compare final model representations</text>
</g>
