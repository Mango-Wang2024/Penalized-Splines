<text x="665" y="478" font-family="Times New Roman, serif" font-size="22" font-style="italic" text-anchor="middle">X<tspan baseline-shift="sub" font-size="14" font-style="normal">fixed</tspan><tspan baseline-shift="baseline" font-size="22">, Z</tspan></text>
<rect x="210" y="556" width="480" height="80" rx="10" fill="#EEF7F3" stroke="#C8D3DC" stroke-width="1.4"/>
