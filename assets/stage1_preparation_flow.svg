<text x="450" y="119" font-size="20" text-anchor="middle">and spline settings</text>
<rect x="60" y="210" width="350" height="70" rx="10" fill="#FFFFFF" stroke="#C8D3DC" stroke-width="1.4"/>
<text x="235" y="238" font-size="20" text-anchor="middle">R / mgcv</text>
<text x="235" y="265" font-size="20" text-anchor="middle">Construct B, S</text>
<rect x="490" y="210" width="350" height="70" rx="10" fill="#FFFFFF" stroke="#C8D3DC" stroke-width="1.4"/>
<text x="665" y="238" font-size="20" text-anchor="middle">Julia</text>
<text x="665" y="265" font-size="20" text-anchor="middle">Construct B, S</text>
<rect x="300" y="306" width="300" height="74" rx="10" fill="#EEF7F3" stroke="#C8D3DC" stroke-width="1.4"/>
<text x="450" y="335" font-size="21" font-weight="700" text-anchor="middle">1. Basis construction</text>
<text x="450" y="363" font-size="20" text-anchor="middle">Compare B and S</text>
<rect x="60" y="418" width="350" height="78" rx="10" fill="#FFFFFF" stroke="#C8D3DC" stroke-width="1.4"/>
<text x="235" y="448" font-size="20" text-anchor="middle">R: prepare model inputs</text>
<text x="235" y="478" font-family="Times New Roman, serif" font-size="22" font-style="italic" text-anchor="middle">X<tspan baseline-shift="sub" font-size="14" font-style="normal">fixed</tspan><tspan baseline-shift="baseline" font-size="22">, Z</tspan></text>
<rect x="490" y="418" width="350" height="78" rx="10" fill="#FFFFFF" stroke="#C8D3DC" stroke-width="1.4"/>
