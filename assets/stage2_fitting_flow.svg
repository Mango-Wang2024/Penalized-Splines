<svg xmlns="http://www.w3.org/2000/svg" width="900" height="870" viewBox="0 0 900 870" role="img" aria-labelledby="title desc">
<title id="title">Stage 2: prepare, fit and compare</title>
<desc id="desc">The same saved observations and spline settings enter separate R and Julia branches. Each repeats Stage 1 preparation, obtains its own model inputs and fits with REML. R uses nlme and Julia uses its adapter and MixedModels. The main comparison checks smoothing strength lambda and fitted response values y-hat. Variance estimates are retained as supporting checks.</desc>
