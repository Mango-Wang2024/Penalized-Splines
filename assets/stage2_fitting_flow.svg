<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" role="img" aria-labelledby="title desc">
<title id="title">Stage 2: fit and compare</title>
<desc id="desc">Independent R and Julia branches for stage 2: fit and compare.</desc>
<rect width="880" height="620" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#687F90"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243746" text-anchor="middle">
<text x="440" y="35" font-size="23" font-weight="700">Stage 2: fit and compare</text>
<rect x="205" y="60" width="470" height="65" rx="9" fill="#EDF4F9" stroke="#CAD5DE" stroke-width="1.4"/>
<text x="440.0" y="86.0">Same predictor values, responses</text>
<text x="440.0" y="111.0">and per-predictor spline settings</text>
<path d="M440 125V145H230V170" fill="none" stroke="#687F90" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M440 125V145H650V170" fill="none" stroke="#687F90" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="65" y="175" width="330" height="82" rx="9" fill="#F8FAFC" stroke="#CAD5DE" stroke-width="1.4"/>
<text x="230.0" y="209.5">R: repeat Stage 1</text>
<text x="230.0" y="234.5">Prepare Xfixed and Z₁, …, Zₘ</text>
<rect x="485" y="175" width="330" height="82" rx="9" fill="#F8FAFC" stroke="#CAD5DE" stroke-width="1.4"/>
<text x="650.0" y="209.5">Julia: repeat Stage 1</text>
<text x="650.0" y="234.5">Prepare Xfixed and Z₁, …, Zₘ</text>
<path d="M230 257V288" fill="none" stroke="#687F90" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M650 257V288" fill="none" stroke="#687F90" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="65" y="293" width="330" height="82" rx="9" fill="#F8FAFC" stroke="#CAD5DE" stroke-width="1.4"/>
<text x="230.0" y="327.5">R / nlme</text>
<text x="230.0" y="352.5">Joint REML fit</text>
<rect x="485" y="293" width="330" height="82" rx="9" fill="#F8FAFC" stroke="#CAD5DE" stroke-width="1.4"/>
<text x="650.0" y="327.5">Julia / MixedModels</text>
<text x="650.0" y="352.5">QR inputs → joint REML fit</text>
<path d="M230 375V406" fill="none" stroke="#687F90" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M650 375V406" fill="none" stroke="#687F90" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="65" y="411" width="330" height="82" rx="9" fill="#F8FAFC" stroke="#CAD5DE" stroke-width="1.4"/>
<text x="230.0" y="445.5">Coefficients: b, τ₁, …, τₘ</text>
<text x="230.0" y="470.5">Variances: σ², r₁², …, rₘ²</text>
<rect x="485" y="411" width="330" height="82" rx="9" fill="#F8FAFC" stroke="#CAD5DE" stroke-width="1.4"/>
<text x="650.0" y="445.5">Coefficients: b, τ₁, …, τₘ</text>
<text x="650.0" y="470.5">Variances: σ², r₁², …, rₘ²</text>
<path d="M230 493V537H440V550" fill="none" stroke="#687F90" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M650 493V537H440V550" fill="none" stroke="#687F90" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="140" y="555" width="600" height="50" rx="9" fill="#ECF6F0" stroke="#CAD5DE" stroke-width="1.4"/>
<text x="440.0" y="586.0">Compare each λⱼ and the resulting fitted responses</text>
</g></svg>
